<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Brick Breaker Arcade</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0e17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=100">
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- 1. BRICK BREAKER ARCADE GAME SCREEN -->
<div id="game-screen" class="game-screen">
<div class="game-wrapper">
<div class="game-hud" id="game-header-secret">
<div class="hud-box">SCORE: <span id="game-score">0</span></div>
<div class="hud-title">🧱 BRICK BREAKER</div>
<div class="hud-box">LIVES: <span id="game-lives">❤️❤️❤️</span></div>
</div>
<canvas id="brick-canvas" width="360" height="460"></canvas>
<div class="game-controls">
<p class="game-hint">Drag finger or mouse left/right to move paddle</p>
<div class="game-btns">
<button class="g-btn" id="restart-game-btn">🔄 Restart</button>
<button class="g-btn g-pause" id="pause-game-btn">⏸️ Pause</button>
</div>
</div>
</div>
</div>

<!-- SECRET LEVEL CODE MODAL -->
<div id="pin-modal" class="modal-overlay hidden">
<div class="modal-card">
<h3>🎮 Enter Level Code</h3>
<p class="sub-text">Unlock custom arcade stage</p>
<input type="password" id="pin-input" placeholder="Code..." inputmode="numeric">
<div class="modal-actions">
<button id="pin-cancel" class="m-btn m-cancel">Cancel</button>
<button id="pin-submit" class="m-btn m-ok">Load</button>
</div>
</div>
</div>

<!-- 2. PROFILE SETUP MODAL -->
<div id="setup-modal" class="modal-overlay hidden">
<div class="modal-card">
<h2>💖 Profile Setup</h2>
<p class="sub-text">Set your details (Fake Code is 0000)</p>
<input type="text" id="my-username" placeholder="Tumche Naav (uda. Shona)" required>
<input type="text" id="room-id" placeholder="Room ID (uda. love777)" required>
<input type="password" id="secret-key" placeholder="Secret Key (Doghansathi Same)" required>
<input type="number" id="calc-pin" placeholder="Secret Unlock PIN (Default: 1430)">
<button id="enter-chat-btn" class="m-btn m-ok" style="width:100%;margin-top:8px;">Save & Continue ❤️</button>
</div>
</div>

<!-- 3. ULTRA 3D ROMANTIC CHAT INTERFACE -->
<div class="app-container hidden" id="app-container">
<div class="aurora-bg"></div>

<header class="chat-header" id="chat-header">
<div class="user-info">
<div class="avatar" id="partner-avatar">💖</div>
<div class="details">
<h2 id="room-title">My Love</h2>
<p id="connection-status">⚪ Offline</p>
</div>
</div>
<div class="header-actions">
<button id="peek-btn" title="Privacy Blur">👁️</button>
<button id="burn-btn" title="30s Auto-Vanish">🔥</button>
<button id="wipe-btn" title="Clear Chat">🧹</button>
<button id="notify-btn" title="Alerts">🔔</button>
<button id="panic-btn" title="Back to Game">🎮</button>
<button id="logout-btn" title="Settings">⚙️</button>
</div>
</header>

<main class="chat-box" id="chat-box"></main>

<div id="reply-bar" class="reply-bar hidden">
<div class="reply-text" id="reply-text"></div>
<button id="cancel-reply">✕</button>
</div>

<div class="extra-panel hidden" id="extra-panel">
<div class="tabs"></div>
<div class="panel-content" id="panel-content"></div>
</div>

<footer class="chat-input-area">
<input type="file" id="file-input" accept="image/*" class="hidden">
<button class="icon-btn" id="add-file" title="Photo">📸</button>
<button class="icon-btn" id="snap-btn" title="1-Time Snap">👻</button>
<button class="icon-btn" id="toggle-emoji" title="Emojis">😍</button>

<div class="input-wrapper">
<input type="text" id="msg-input" placeholder="Whisper something..." autocomplete="off">
<button class="spoiler-toggle" id="spoiler-btn" title="Spoiler">✨</button>
</div>

<button class="icon-btn mic-btn" id="mic-btn" title="Voice Note">🎤</button>
<button class="icon-btn send-btn" id="send-btn" title="Send">➤</button>
</footer>
</div>

<!-- 4. SNAPCHAT 1-TIME VIEW MODAL -->
<div id="snap-modal" class="modal-overlay hidden">
<div class="snap-viewer">
<div class="snap-top">
<span>🔥 1-Time Snap</span>
<button id="close-snap-btn">✕ Close</button>
</div>
<img id="snap-img" src="" alt="Snap">
</div>
</div>

<!-- 5. TELEGRAM MESSAGE ACTION MENU -->
<div id="msg-menu-modal" class="modal-overlay hidden">
<div class="action-sheet">
<button id="menu-reply">↩️ Reply</button>
<button id="menu-edit">✏️ Edit Message</button>
<button id="menu-copy">📋 Copy Text</button>
<button id="menu-delete" class="danger-btn">🗑️ Delete for Everyone</button>
<button id="menu-cancel">Cancel</button>
</div>
</div>

<div id="hearts-container"></div>
<script src="app.js?v=100"></script>
</body>
</html>
