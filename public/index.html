<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- 1. DECOY GAME SCREEN (Tic Tac Toe) -->
    <div id="game-screen" class="game-screen">
        <h2 id="game-title" class="game-title">Tic Tac Toe</h2>
        <p class="game-status" id="game-status">Player X's Turn</p>
        <div class="game-board" id="game-board">
            <div class="cell" data-index="0"></div><div class="cell" data-index="1"></div><div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div><div class="cell" data-index="4"></div><div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div><div class="cell" data-index="7"></div><div class="cell" data-index="8"></div>
        </div>
        <button class="reset-game-btn" onclick="resetGame()">Restart Game</button>
    </div>

    <!-- 2. SECRET SETUP MODAL -->
    <div id="setup-modal" class="setup-modal hidden">
        <div class="setup-card">
            <h2>💖 Secret Vault</h2>
            <p class="sub-text">Welcome back to the secure dimension.</p>
            <input type="text" id="my-username" placeholder="Tumche Naav (uda. Shona)" required>
            <input type="text" id="room-id" placeholder="Secret Room ID" required>
            <input type="password" id="secret-key" placeholder="Encryption PIN" required>
            <button id="enter-chat-btn">Enter Vault 🔒</button>
        </div>
    </div>

    <!-- 3. 3D ROMANTIC CHAT INTERFACE -->
    <div class="app-container hidden" id="app-container">
        <header class="chat-header" id="chat-header">
            <div class="user-info">
                <div class="avatar" id="partner-avatar">💑</div>
                <div class="details">
                    <h2 id="room-title">Secret Room</h2>
                    <p id="connection-status">🟢 Connected</p>
                </div>
            </div>
            <div class="header-actions">
                <button id="burn-btn" title="Self-Destruct">🔥</button>
                <button id="panic-btn" title="Hide to Game">🎮</button>
            </div>
        </header>
        
        <main class="chat-box" id="chat-box">
            <div class="security-banner">
                💖 3D Encrypted Vault • Long-press message to Delete for Everyone
            </div>
        </main>

        <div id="reply-bar" class="reply-bar hidden">
            <div class="reply-text" id="reply-text"></div>
            <button id="cancel-reply">✕</button>
        </div>
        
        <div class="extra-panel hidden" id="extra-panel">
            <div class="tabs">
                <button id="tab-recent" class="active">🕒</button>
                <button id="tab-faces">😀</button>
                <button id="tab-love">❤️</button>
                <button id="tab-sticker">💌</button>
            </div>
            <div class="panel-content" id="panel-content"></div>
        </div>

        <footer class="chat-input-area">
            <input type="file" id="file-input" accept="image/*" class="hidden">
            <button class="icon-btn" id="add-file">📸</button>
            <button class="icon-btn" id="toggle-emoji">😍</button>
            <div class="input-wrapper">
                <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
            </div>
            <button class="icon-btn send-btn" id="send-btn">➤</button>
        </footer>
    </div>
    
    <div id="hearts-container"></div>
    <script src="app.js"></script>
</body>
</html>
